<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Undertwig Engine</title>
</head>
<body>
  <script src="./PdfTeXEngine.js"></script>
  <script>
    (function () {
      "use strict";

      function bytesToBase64(bytes) {
        var binary = "";
        var chunk = 0x8000;
        for (var i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(
            null,
            bytes.subarray(i, Math.min(i + chunk, bytes.length))
          );
        }
        return btoa(binary);
      }

      function base64ToBytes(b64) {
        var binary = atob(b64);
        var out = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
          out[i] = binary.charCodeAt(i);
        }
        return out;
      }

      function post(type, payload) {
        if (window.UndertwigNative && window.UndertwigNative.postMessage) {
          window.UndertwigNative.postMessage(
            JSON.stringify(Object.assign({ type: type }, payload || {}))
          );
        }
      }

      async function ensureFormat(engine) {
        post("progress", { message: "Loading TeX format…" });
        var fmtUrl = new URL("./swiftlatexpdftex.fmt", window.location.href).href;
        // Parent-frame fetch + same-origin install into the iframe (no postMessage).
        var response = await fetch(fmtUrl);
        if (!response.ok) {
          throw new Error(
            "Could not load bundled swiftlatexpdftex.fmt (" + response.status + ")"
          );
        }
        var buffer = await response.arrayBuffer();
        if (!buffer.byteLength) {
          throw new Error("Bundled swiftlatexpdftex.fmt is empty");
        }
        await engine.preloadTexFile("swiftlatexpdftex.fmt", buffer);
      }

      window.UndertwigEngine = {
        ready: false,
        compile: async function (filesJson) {
          try {
            post("progress", { message: "Loading pdfLaTeX…" });
            if (typeof PdfTeXEngine !== "function") {
              throw new Error("PdfTeXEngine is not available.");
            }
            var engine = new PdfTeXEngine();
            await engine.loadEngine();
            await ensureFormat(engine);
            post("progress", { message: "Writing project files…" });

            var projectFiles = JSON.parse(filesJson);
            var folders = {};
            Object.keys(projectFiles).forEach(function (path) {
              var parts = path.split("/");
              parts.pop();
              var current = "";
              parts.forEach(function (part) {
                current = current ? current + "/" + part : part;
                folders[current] = true;
              });
            });
            Object.keys(folders)
              .sort(function (a, b) {
                return a.split("/").length - b.split("/").length;
              })
              .forEach(function (folder) {
                engine.makeMemFSFolder(folder);
              });

            Object.keys(projectFiles).forEach(function (path) {
              var file = projectFiles[path];
              var content = file.binary
                ? base64ToBytes(file.content)
                : file.content || "";
              engine.writeMemFSFile(path, content);
            });

            engine.setEngineMainFile("main.tex");
            var result = null;
            var auxFiles = {};
            for (var pass = 1; pass <= 2; pass++) {
              post("progress", {
                message: "Converting with pdfLaTeX (pass " + pass + "/2)…",
              });
              Object.keys(auxFiles).forEach(function (path) {
                engine.writeMemFSFile(path, auxFiles[path]);
              });
              result = await engine.compileLaTeX();
              if (result && result.aux && typeof result.aux === "object") {
                auxFiles = result.aux;
              }
              if (!result || result.status !== 0 || !result.pdf) {
                break;
              }
            }

            if (engine.closeWorker) {
              try {
                engine.closeWorker();
              } catch (_e) {}
            }

            var ok = !!(result && result.status === 0 && result.pdf);
            var pdfBase64 = ok ? bytesToBase64(result.pdf) : null;
            post("result", {
              ok: ok,
              pdfBase64: pdfBase64,
              log: (result && result.log) || "No compiler log returned.",
            });
            return ok;
          } catch (error) {
            post("result", {
              ok: false,
              pdfBase64: null,
              log: String((error && error.message) || error || "Convert failed."),
            });
            return false;
          }
        },
      };

      window.UndertwigEngine.ready = true;
      post("ready", {});
    })();
  </script>
</body>
</html>
